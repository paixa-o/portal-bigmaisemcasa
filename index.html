<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#d32f2f" />
    <title>Login - Portal Bigmais em Casa</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/svg+xml" href="global/icon.svg" />
    <link rel="apple-touch-icon" href="global/icon.svg" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        min-height: 100vh;
        background: linear-gradient(135deg, #b71c1c 0%, #d32f2f 52%, #1e293b 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        color: #1e293b;
      }

      .card-login {
        width: 100%;
        max-width: 440px;
        background-color: #ffffff;
        border-radius: 12px;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.28);
        padding: 28px 26px;
      }

      .topo-login {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        margin-bottom: 22px;
        padding-bottom: 16px;
        border-bottom: 1px solid #e2e8f0;
      }

      .logo-box-login {
        background-color: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 8px 14px;
        margin-bottom: 12px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
      }

      .logo-box-login img {
        height: 42px;
        width: auto;
        display: block;
      }

      .topo-login h1 {
        font-size: 20px;
        color: #b71c1c;
        margin-bottom: 4px;
      }

      .topo-login p {
        font-size: 13px;
        color: #64748b;
      }

      .campo {
        display: flex;
        flex-direction: column;
        margin-bottom: 14px;
      }

      label {
        font-size: 13px;
        font-weight: 600;
        color: #334155;
        margin-bottom: 6px;
      }

      select,
      input[type="password"] {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 7px;
        font-size: 14px;
        background-color: #ffffff;
        color: #1e293b;
      }

      select:focus,
      input[type="password"]:focus {
        outline: none;
        border-color: #d32f2f;
        box-shadow: 0 0 0 3px rgba(211, 47, 47, 0.14);
      }

      .aviso-primeiro-acesso {
        display: none;
        background-color: #fef3c7;
        border: 1px solid #f59e0b;
        color: #92400e;
        padding: 10px 12px;
        border-radius: 7px;
        font-size: 12.5px;
        line-height: 1.4;
        margin-bottom: 14px;
      }

      .mensagem-erro {
        display: none;
        background-color: #fee2e2;
        border: 1px solid #fca5a5;
        color: #991b1b;
        padding: 10px 12px;
        border-radius: 7px;
        font-size: 13px;
        margin-bottom: 14px;
      }

      .opcoes-sessao {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: #475569;
        margin-bottom: 18px;
      }

      .opcoes-sessao input[type="checkbox"] {
        width: 16px;
        height: 16px;
        accent-color: #d32f2f;
        cursor: pointer;
      }

      .btn-entrar {
        width: 100%;
        background-color: #d32f2f;
        color: #ffffff;
        border: none;
        border-radius: 7px;
        padding: 12px 16px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: background-color 0.2s;
      }

      .btn-entrar:hover:not(:disabled) {
        background-color: #b71c1c;
      }

      .btn-entrar:disabled {
        background-color: #94a3b8;
        cursor: not-allowed;
      }

      .rodape-login {
        margin-top: 16px;
        text-align: center;
        font-size: 12px;
        color: #94a3b8;
      }
    </style>
  </head>

  <body>
    <main class="card-login">
      <div class="topo-login">
        <div class="logo-box-login">
          <img src="global/logo-bigmais.png" alt="Logo Bigmais em Casa" />
        </div>
        <h1>Portal Bigmais em Casa</h1>
        <p>Selecione seu usuário para acessar o portal</p>
      </div>

      <form id="form-login" onsubmit="aoEnviarLogin(event)">
        <div class="campo">
          <label for="select-usuario">Usuário</label>
          <select id="select-usuario" onchange="aoSelecionarUsuario()">
            <option value="">Selecione um usuário...</option>
          </select>
        </div>

        <div id="aviso-primeiro-acesso" class="aviso-primeiro-acesso">
          <strong>Primeiro acesso detectado:</strong> este usuário ainda não possui senha cadastrada. Crie uma senha (mínimo 6 caracteres) para vincular à Planilha Google.
        </div>

        <div id="grupo-senha-login" class="campo">
          <label for="input-senha">Senha</label>
          <input
            type="password"
            id="input-senha"
            placeholder="Digite sua senha..."
            autocomplete="current-password"
          />
        </div>

        <div id="grupo-cadastro-senha" style="display: none;">
          <div class="campo">
            <label for="input-nova-senha">Cadastrar Senha</label>
            <input
              type="password"
              id="input-nova-senha"
              placeholder="Crie uma senha (mín. 6 caracteres)..."
              autocomplete="new-password"
            />
          </div>
          <div class="campo">
            <label for="input-confirmar-senha">Confirmar Senha</label>
            <input
              type="password"
              id="input-confirmar-senha"
              placeholder="Repita a senha criada..."
              autocomplete="new-password"
            />
          </div>
        </div>

        <div id="mensagem-erro" class="mensagem-erro"></div>

        <label class="opcoes-sessao">
          <input type="checkbox" id="check-lembrar" checked />
          <span>Manter conectado neste dispositivo</span>
        </label>

        <button type="submit" id="btn-submit-login" class="btn-entrar">
          Entrar
        </button>
      </form>

      <div class="rodape-login" id="versao-login"></div>
    </main>

    <script src="global/config.js"></script>
    <script src="global/auth.js"></script>
    <script>
      let modoCadastroPrimeiroAcesso = false;

      if (obterSessaoAtual()) {
        window.location.replace("home.html");
      }

      const elVersaoLogin = document.getElementById("versao-login");
      if (elVersaoLogin && typeof VERSAO_PORTAL !== "undefined") {
        elVersaoLogin.textContent = `Versão ${VERSAO_PORTAL}`;
      }

      const selectUsuario = document.getElementById("select-usuario");
      if (typeof USUARIOS_PREDEFINIDOS !== "undefined") {
        USUARIOS_PREDEFINIDOS.forEach((u) => {
          const opt = document.createElement("option");
          opt.value = u.id;
          opt.textContent = u.rotulo;
          selectUsuario.appendChild(opt);
        });
      }

      function mostrarErro(msg) {
        const el = document.getElementById("mensagem-erro");
        el.textContent = msg;
        el.style.display = "block";
      }

      function limparErro() {
        const el = document.getElementById("mensagem-erro");
        el.textContent = "";
        el.style.display = "none";
      }

      function definirModoCadastro(ativar) {
        modoCadastroPrimeiroAcesso = ativar;
        document.getElementById("aviso-primeiro-acesso").style.display = ativar
          ? "block"
          : "none";
        document.getElementById("grupo-senha-login").style.display = ativar
          ? "none"
          : "flex";
        document.getElementById("grupo-cadastro-senha").style.display = ativar
          ? "block"
          : "none";
        document.getElementById("btn-submit-login").textContent = ativar
          ? "Cadastrar Senha e Entrar"
          : "Entrar";

        document.getElementById("input-senha").value = "";
        document.getElementById("input-nova-senha").value = "";
        document.getElementById("input-confirmar-senha").value = "";
      }

      async function aoSelecionarUsuario() {
        limparErro();
        const usuarioId = selectUsuario.value;
        definirModoCadastro(false);

        if (!usuarioId) return;

        const btn = document.getElementById("btn-submit-login");
        btn.disabled = true;
        btn.textContent = "Verificando usuário...";

        try {
          const res = await consultarStatusUsuarioPlanilha(usuarioId);
          if (!res.sucesso) {
            throw new Error(res.erro || "Falha ao consultar usuário.");
          }

          if (!res.cadastrado) {
            definirModoCadastro(true);
            document.getElementById("input-nova-senha").focus();
          } else {
            definirModoCadastro(false);
            document.getElementById("input-senha").focus();
          }
        } catch (err) {
          mostrarErro(
            "Não foi possível consultar o status do usuário na Planilha Google. Verifique a conexão e a API."
          );
          btn.textContent = "Entrar";
        } finally {
          btn.disabled = false;
        }
      }

      async function aoEnviarLogin(event) {
        event.preventDefault();
        limparErro();

        const usuarioId = selectUsuario.value;
        if (!usuarioId) {
          mostrarErro("Selecione um usuário da lista.");
          return;
        }

        const usuarioConfig = obterUsuarioConfig(usuarioId);
        if (!usuarioConfig) {
          mostrarErro("Usuário inválido.");
          return;
        }

        const lembrar = document.getElementById("check-lembrar").checked;
        const btn = document.getElementById("btn-submit-login");
        btn.disabled = true;

        try {
          if (modoCadastroPrimeiroAcesso) {
            const novaSenha = document.getElementById("input-nova-senha").value;
            const confirmar = document.getElementById("input-confirmar-senha").value;

            if (novaSenha.length < 6) {
              mostrarErro("A senha deve ter pelo menos 6 caracteres.");
              btn.disabled = false;
              return;
            }
            if (novaSenha !== confirmar) {
              mostrarErro("As senhas digitadas não conferem.");
              btn.disabled = false;
              return;
            }

            btn.textContent = "Salvando senha...";
            const cad = await cadastrarSenhaUsuarioPlanilha(usuarioConfig, novaSenha);
            if (!cad.sucesso) {
              throw new Error(cad.erro || "Não foi possível cadastrar a senha.");
            }

            salvarSessaoAtual(usuarioConfig, lembrar);
            window.location.replace("home.html");
            return;
          }

          const senha = document.getElementById("input-senha").value;
          if (!senha) {
            mostrarErro("Digite sua senha.");
            btn.disabled = false;
            return;
          }

          btn.textContent = "Autenticando...";
          const auth = await autenticarUsuarioPlanilha(usuarioConfig, senha);

          if (auth.naoCadastrado) {
            definirModoCadastro(true);
            btn.disabled = false;
            return;
          }

          if (!auth.sucesso || !auth.autenticado) {
            mostrarErro(auth.erro || "Senha incorreta.");
            btn.disabled = false;
            btn.textContent = "Entrar";
            return;
          }

          salvarSessaoAtual(usuarioConfig, lembrar);
          window.location.replace("home.html");
        } catch (err) {
          mostrarErro(err.message || "Erro de comunicação com o servidor.");
          btn.disabled = false;
          btn.textContent = modoCadastroPrimeiroAcesso
            ? "Cadastrar Senha e Entrar"
            : "Entrar";
        }
      }
    </script>
  </body>
</html>
